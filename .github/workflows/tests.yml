name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # The tests mock the LLM: no API key or quota needed.
      - run: uv run pytest -q

  docker:
    # Monta a imagem e confere que o container liga e responde, sem chamar o LLM.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t clave .
      - name: Container responde em /saude
        run: |
          docker run -d --name clave -p 8010:7860 -e LLM_API_KEY=chave-falsa-do-ci clave
          for i in $(seq 1 30); do
            curl -fs http://localhost:8010/saude && exit 0
            sleep 1
          done
          docker logs clave
          exit 1
